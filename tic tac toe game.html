<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe | Smart AI</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI,sans-serif;
}

/* MENU */
.menu{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.9);
    display:flex;
    justify-content:center;
    align-items:center;
}
.menu-box{
    background:#1e293b;
    padding:30px 45px;
    border-radius:22px;
    text-align:center;
}
.menu-box h1{
    color:#fff;
    margin-bottom:25px;
}
.menu-box button{
    width:240px;
    padding:14px;
    margin:10px 0;
    font-size:17px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#38bdf8;
    transition:.2s;
}
.menu-box button:hover{
    background:#0ea5e9;
    transform:scale(1.08);
}

/* GAME */
.game-box{
    background:rgba(255,255,255,.08);
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    display:none;
}
h2{color:#fff}

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:10px;
    justify-content:center;
    margin:15px 0;
}
.cell{
    width:100px;
    height:100px;
    background:rgba(255,255,255,.15);
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    cursor:pointer;
    transition:.2s;
}
.cell:hover{
    background:rgba(255,255,255,.25);
    transform:scale(1.05);
}
.cell.win{
    background:#00e676;
    color:#000;
}
.status{
    color:#fff;
    font-size:18px;
    margin-bottom:10px;
}

.controls img{
    width:55px;
    cursor:pointer;
    transition:.2s;
}
.controls img:hover{transform:scale(1.15)}
</style>
</head>

<body>

<!-- START MENU -->
<div class="menu" id="menu">
    <div class="menu-box">
        <h1>Tic Tac Toe 😈😇</h1>
        <button onclick="startPvP()">▶ Player vs Player</button>
        <button onclick="startAI()">🤖 Player vs AI</button>
    </div>
</div>

<!-- GAME -->
<div class="game-box" id="game">
    <h2>Tic Tac Toe</h2>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>

    <div class="controls">
        <img src="https://i.ibb.co/C3H6xpMw/restart.png" onclick="restartGame()" title="Restart">
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
